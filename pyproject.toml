[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "scorekeel"
dynamic = ["version"]
description = "Zero-Python single-binary Rust LightGBM scorer & exact Lundberg TreeSHAP explainer for CSV, JSONL, Parquet, and HTTP."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Robert Guss" }]
requires-python = ">=3.9"
keywords = ["lightgbm", "shap", "ml", "inference", "rust", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/robertguss/scorekeel"
Repository = "https://github.com/robertguss/scorekeel"
Issues = "https://github.com/robertguss/scorekeel/issues"

[tool.maturin]
bindings = "bin"
compatibility = "pypi"
strip = true
