[package]
name = "scorekeel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Zero-Python single-binary Rust LightGBM scorer & exact Lundberg TreeSHAP explainer for CSV, JSONL, Parquet, and HTTP microservices (DX + AX)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/robertguss/scorekeel"
homepage = "https://github.com/robertguss/scorekeel"
keywords = ["lightgbm", "shap", "ml", "inference", "cli"]
categories = ["command-line-utilities", "science", "development-tools"]

[dependencies]
arrow-array = "60.2"
arrow-schema = "60.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
csv = "1.4"
indexmap = { version = "2.14", features = ["serde"] }
owo-colors = { version = "4.4", features = ["supports-colors"] }
parquet = { version = "60.2", default-features = false, features = ["arrow", "snap", "flate2-rust_backend", "zstd"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.2"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
